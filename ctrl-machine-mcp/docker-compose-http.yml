version: '3.8'

services:
  mcp-http:
    image: mcp-http:latest
    container_name: mcp-http
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.http
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-mcp123}
      - DISPLAY=:99
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
    ports:
      - "5900:5900"   # VNC
      - "8080:8080"   # Screenshot MCP HTTP
      - "8081:8081"   # HID Input MCP HTTP
    volumes:
      - ./screenshots:/app/screenshots:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s