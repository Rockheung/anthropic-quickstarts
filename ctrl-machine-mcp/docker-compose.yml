version: '3.8'

services:
  hid-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hid-input-mcp
    environment:
      - DISPLAY=:99
      - START_BROWSER=false
      - CHROME_URL=https://www.google.com
      # MCP Configuration
      - MCP_LOG_LEVEL=INFO
    ports:
      # VNC port for debugging (view the virtual display)
      - "5900:5900"
      # MCP server port (if using HTTP transport)
      - "8080:8080"
    volumes:
      # Mount the MCP server script
      - ./hid_input_mcp.py:/app/hid_input_mcp.py:ro
      # Share X11 socket (for host display, optional)
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Required for GUI automation
    privileged: true
    shm_size: '2gb'
    stdin_open: true
    tty: true
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Screenshot MCP server (if you have one)
  # screenshot-mcp:
  #   build:
  #     context: ../screenshot-mcp
  #     dockerfile: Dockerfile
  #   container_name: screenshot-mcp
  #   environment:
  #     - DISPLAY=:99
  #   volumes:
  #     - screenshots:/app/screenshots
  #   networks:
  #     - mcp-network
  #   depends_on:
  #     - hid-mcp

networks:
  mcp-network:
    driver: bridge

volumes:
  screenshots:
    driver: local