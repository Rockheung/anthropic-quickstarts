version: '3.8'

services:
  mcp-unified:
    image: mcp-unified:latest
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: mcp-unified
    environment:
      - DISPLAY=:99
      - START_BROWSER=false
      - CHROME_URL=https://www.google.com
      # VNC Password (optional - remove or leave empty for no password)
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      # MCP Configuration
      - MCP_LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    ports:
      # VNC port for debugging (view the virtual display)
      - "5900:5900"
    volumes:
      # Mount unified MCP server and legacy servers
      - ./unified_mcp_server.py:/app/unified_mcp_server.py:ro
      - ./hid_input_mcp.py:/app/hid_input_mcp.py:ro
      - ./screenshot_mcp.py:/app/screenshot_mcp.py:ro
      # Optional: Save screenshots
      - ./screenshots:/app/screenshots
      # Share X11 socket (for host display, optional)
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Required for GUI automation
    privileged: true
    shm_size: '2gb'
    stdin_open: true
    tty: true
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge

volumes:
  screenshots:
    driver: local