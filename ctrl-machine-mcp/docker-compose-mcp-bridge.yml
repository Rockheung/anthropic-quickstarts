services:
  mcp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.mcp-bridge
    container_name: mcp-bridge
    ports:
      - "5900:5900"   # VNC port
      - "8080:8080"   # Screenshot MCP port
      - "8081:8081"   # HID Input MCP port
    environment:
      - DISPLAY=:99
      - SCREENSHOT_MCP_PORT=8080
      - HID_MCP_PORT=8081
    volumes:
      - ./screenshots:/app/screenshots
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge