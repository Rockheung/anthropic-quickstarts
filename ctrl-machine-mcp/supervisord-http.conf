[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autostart=true
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err
user=mcpuser

[program:fluxbox]
command=/usr/bin/fluxbox
autostart=true
autorestart=true
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err
environment=DISPLAY=":99"
user=mcpuser

[program:vnc]
command=/bin/bash -c 'if [ -f /home/mcpuser/.vnc/passwd ]; then x11vnc -display :99 -rfbauth /home/mcpuser/.vnc/passwd -listen 0.0.0.0 -forever -shared; else x11vnc -display :99 -nopw -listen 0.0.0.0 -forever -shared; fi'
autostart=true
autorestart=true
stdout_logfile=/var/log/vnc.log
stderr_logfile=/var/log/vnc.err
user=mcpuser

[program:screenshot-mcp]
command=python3 /app/screenshot_mcp_http.py
autostart=true
autorestart=true
stdout_logfile=/var/log/screenshot-mcp.log
stderr_logfile=/var/log/screenshot-mcp.err
environment=DISPLAY=":99",SCREENSHOT_MCP_PORT="8080"
user=mcpuser

[program:hid-mcp]
command=python3 /app/hid_input_mcp_http.py
autostart=true
autorestart=true
stdout_logfile=/var/log/hid-mcp.log
stderr_logfile=/var/log/hid-mcp.err
environment=DISPLAY=":99",HID_MCP_PORT="8081"
user=mcpuser