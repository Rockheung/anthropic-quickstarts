version: '3.8'

services:
  mcp-remote:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: mcp-remote-server:latest
    container_name: mcp-remote-server
    platform: linux/amd64
    
    environment:
      - DISPLAY=:99
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - VNC_PASSWORD=${VNC_PASSWORD:-mcp123}
      - PYTHONUNBUFFERED=1
    
    ports:
      # MCP HTTP API
      - "8000:8000"
      # VNC for debugging (optional)
      - "5900:5900"
    
    volumes:
      # Mount screenshots directory for debugging
      - ./screenshots:/app/screenshots
      # Mount logs
      - ./logs:/app/logs
    
    networks:
      - mcp-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16